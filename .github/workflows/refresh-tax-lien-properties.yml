name: Refresh property-level tax liens

on:
  workflow_dispatch:
  schedule:
    - cron: "37 14 * * *"
  workflow_run:
    workflows:
      - "Refresh tax deed property data"
    types:
      - completed
  push:
    paths:
      - "scripts/refresh_tax_lien_properties.py"
      - "scripts/refresh_iowa_johnson_tax_liens.py"
      - "scripts/refresh_iowa_linn_tax_liens.py"
      - "scripts/refresh_iowa_linn_tax_liens_xlsx.py"
      - "scripts/repair_iowa_linn_pdf_parser.py"
      - "scripts/enrich_indiana_assessed_values.py"
      - "scripts/recount_tax_lien_properties.py"
      - "tests/test_tax_lien_properties.py"
      - "tests/test_iowa_johnson_tax_liens.py"
      - "tests/test_iowa_linn_tax_liens.py"
      - "tests/test_enrich_indiana_assessed_values.py"
      - "tax-lien-properties.html"
      - "calendar.html"
      - "sw.js"
      - ".github/workflows/refresh-tax-lien-properties.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "tax-lien-properties.html"
      - "calendar.html"
      - "sw.js"
      - ".github/workflows/refresh-tax-lien-properties.yml"

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install openpyxl pdfplumber pypdf requests beautifulsoup4
      - name: Refresh individual tax-lien records
        run: python scripts/refresh_tax_lien_properties.py
      - name: Enrich Indiana records with official assessed values
        run: python scripts/enrich_indiana_assessed_values.py
      - name: Refresh Johnson County Iowa tax liens
        id: iowa_johnson
        continue-on-error: true
        run: python scripts/refresh_iowa_johnson_tax_liens.py
      - name: Refresh Linn County Iowa tax liens from official Excel with resilient PDF fallback
        id: iowa_linn
        continue-on-error: true
        run: python scripts/repair_iowa_linn_pdf_parser.py
      - name: Verify Iowa collectors materially populated generated output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("data/tax-lien-properties.json").read_text(encoding="utf-8"))
          rows = doc.get("properties", [])
          minimums = {"IA-Johnson-2026": 700, "IA-Linn-2026": 1500}
          for profile_id, minimum in minimums.items():
              county_rows = [row for row in rows if row.get("profile_id") == profile_id]
              if not county_rows:
                  print(f"WARNING: {profile_id} has no rows yet; not blocking the shared pipeline.")
                  continue
              if len(county_rows) < minimum:
                  raise SystemExit(f"{profile_id}: only {len(county_rows)} generated rows; expected at least {minimum}")
              if any(any("owner" in str(key).lower() for key in row) for row in county_rows):
                  raise SystemExit(f"{profile_id}: restricted owner-name field appeared in generated output")
          linn_items = [int(row["sale_item_number"]) for row in rows if row.get("profile_id") == "IA-Linn-2026" and row.get("sale_item_number")]
          if linn_items and max(linn_items) > 1568:
              raise SystemExit("IA-Linn-2026: generated output crossed into the mobile-home section")
          print("Verified Johnson and Linn property-level lien output thresholds and safety constraints.")
          PY
      - name: Recount lien and combined website coverage
        run: python scripts/recount_tax_lien_properties.py
      - name: Validate generated data and pages
        run: python -m unittest discover -s tests -v
      - name: Publish refreshed lien data safely
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_run'
        run: |
          if git diff --quiet -- data/tax-lien-properties.json data/refresh-status.json; then
            echo "No property-level lien or coverage changes."
            exit 0
          fi
          cp data/tax-lien-properties.json /tmp/tax-lien-properties.json
          cp data/refresh-status.json /tmp/refresh-status.json
          git config user.name "tax-lien-data-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tax-lien-properties.json data/tax-lien-properties.json
            cp /tmp/refresh-status.json data/refresh-status.json
            if git diff --quiet -- data/tax-lien-properties.json data/refresh-status.json; then
              echo "Latest main already contains this dataset and coverage summary."
              exit 0
            fi
            git add data/tax-lien-properties.json data/refresh-status.json
            git commit -m "chore: refresh property-level tax liens and coverage"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to publish after three safe retries."
          exit 1
