name: Audit King County tax amounts

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_king_tax_amounts.py"
      - ".github/workflows/audit-king-tax.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Audit raw King County tax amounts
        run: python scripts/audit_king_tax_amounts.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- data/king-tax-audit.json)" ]; then
            exit 0
          fi
          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/king-tax-audit.json
          git commit -m "chore: audit King County tax amounts"
          git pull --rebase origin main
          git push origin main
