name: Test King County data integrity

on:
  workflow_dispatch:
  push:
    paths:
      - "data/king-gaps.json"
      - "tests/test_king_county_integrity.py"
      - ".github/workflows/test-king-integrity.yml"

permissions:
  contents: read

jobs:
  king-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify completed King County enrichment has not regressed
        run: python -m unittest tests.test_king_county_integrity -v
