name: Refresh tax deed property data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-properties.yml"

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before refresh
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4 pdfplumber
      - name: Save previous verified property data
        run: cp data/properties.json /tmp/properties-before-refresh.json
      - name: Refresh official property feeds
        run: python scripts/refresh_properties.py
      - name: Refresh Florida lands-available tax deed properties
        run: python scripts/refresh_florida_tax_deeds.py
      - name: Preserve King County rows after source-feed collapse
        run: python scripts/preserve_king_rows_on_feed_failure.py
      - name: Preserve King County tax fields after transient failures
        run: python scripts/preserve_king_tax_on_transient_failure.py
      - name: Normalize King County tax receivables to dollars
        run: python scripts/fix_king_tax_amounts.py
      - name: Repair King County coordinates
        run: python scripts/fix_king_coordinates.py
      - name: Recover King County city and ZIP from coordinates
        run: python scripts/fix_king_area_from_coordinates.py
      - name: Recover basic fields for King County GIS-orphan parcels
        run: python scripts/fix_king_orphan_public_fallbacks.py
      - name: Recover hard GIS orphans from WA State Parcels Project
        run: python scripts/fix_king_state_parcel_fallback.py
      - name: Enrich King County area metrics
        run: python scripts/enrich_king_area_metrics.py
      - name: Restore King County condo parent fields after direct-GIS enrichment
        run: python scripts/fix_king_condo_parent.py
      - name: Recover missing King County appraised values from eReal Property
        run: python scripts/fix_king_ereal_values.py
      - name: Fill missing King County tax status from official foreclosure list
        run: python scripts/fix_king_foreclosure_status.py
      - name: Enrich scoped King County public safety metrics
        id: king_public_safety
        continue-on-error: true
        run: python scripts/enrich_king_public_safety.py
      - name: Preserve verified King public-safety data if source is unavailable
        if: steps.king_public_safety.outcome == 'failure'
        run: python scripts/restore_king_public_safety_after_source_failure.py
      - name: Fill Seattle public-safety gaps from official SPD beats
        continue-on-error: true
        run: python scripts/fix_seattle_spd_beat_fallback.py
      - name: Diagnose remaining King County gaps
        run: python scripts/diagnose_king_gaps.py
      - name: Refresh Coconino Arizona OTC tax-lien property feed
        run: python scripts/refresh_coconino_tax_liens.py
      - name: Refresh Alabama Nebraska Arizona Colorado and Iowa tax lien markets
        run: python scripts/add_more_tax_lien_states.py
      - name: Add Mississippi DeSoto County tax lien market
        run: python scripts/add_mississippi_tax_lien.py
      - name: Add Kentucky certificate of delinquency market
        run: python scripts/add_kentucky_tax_lien.py
      - name: Add South Dakota Stanley County tax lien market
        run: python scripts/add_south_dakota_tax_lien.py
      - name: Add West Virginia State Auditor tax lien market
        run: python scripts/add_west_virginia_tax_lien_market.py
      - name: Add Indiana Allen County tax lien market
        run: python scripts/add_indiana_tax_lien_market.py
      - name: Add Wyoming Carbon County tax lien market
        run: python scripts/add_wyoming_tax_lien_market.py
      - name: Add Missouri Clay County tax lien market
        run: python scripts/add_missouri_tax_lien_market.py
      - name: Add Maryland Montgomery County tax lien market
        run: python scripts/add_maryland_tax_lien_market.py
      - name: Add District of Columbia OTR tax lien market
        run: python scripts/add_dc_tax_lien_market.py
      - name: Add Florida Pinellas County tax lien market
        run: python scripts/add_florida_tax_lien_market.py
      - name: Add Florida Broward County tax lien market
        run: python scripts/add_florida_broward_tax_lien_market.py
      - name: Add Florida Hillsborough County tax lien market
        run: python scripts/add_florida_hillsborough_tax_lien_market.py
      - name: Add New Jersey municipal tax lien market
        run: python scripts/add_new_jersey_tax_lien_market.py
      - name: Add Illinois Stark County tax lien market
        run: python scripts/add_illinois_tax_lien_market.py
      - name: Add Ohio Franklin County tax lien market
        run: python scripts/add_ohio_tax_lien_market.py
      - name: Add Nevada Clark County special-assessment lien market
        run: python scripts/add_nevada_tax_lien_market.py
      - name: Add Arizona Maricopa County tax lien market
        run: python scripts/add_arizona_maricopa_tax_lien_market.py
      - name: Add Arizona Yavapai County tax lien market
        run: python scripts/add_arizona_yavapai_tax_lien_market.py
      - name: Add Arizona Mohave County tax lien market
        run: python scripts/add_arizona_mohave_tax_lien_market.py
      - name: Add Arizona Pinal County tax lien market
        run: python scripts/add_arizona_pinal_tax_lien_market.py
      - name: Add max return rate comparison
        run: python scripts/add_max_return_rates.py
      - name: Ensure tax lien county and market filter
        run: python scripts/add_tax_lien_county_filter.py
      - name: Publish refreshed data and guide safely
        run: |
          if git diff --quiet -- data/ index.html; then
            echo "No data or guide changes."
            exit 0
          fi

          # Preserve the fully generated output, then anchor the publish commit on
          # the newest main. This avoids rebasing generated JSON/HTML after a
          # concurrent source/workflow commit changes main during the long refresh.
          rm -rf /tmp/refresh-output
          mkdir -p /tmp/refresh-output
          cp -a data /tmp/refresh-output/data
          cp index.html /tmp/refresh-output/index.html

          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -a /tmp/refresh-output/data data
            cp /tmp/refresh-output/index.html index.html

            if git diff --quiet -- data/ index.html; then
              echo "Latest main already contains the generated output."
              exit 0
            fi

            git add data/ index.html
            git commit -m "chore: refresh tax deed and tax lien data"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Publish raced with a newer main commit; retrying from latest main (attempt ${attempt}/3)."
          done

          echo "Unable to publish refreshed output after 3 safe retries."
          exit 1
