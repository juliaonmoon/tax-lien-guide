name: Enable installable app

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/enable-pwa.yml"

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add PWA hooks to site pages
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              Path('index.html'),
              Path('tax-lien-properties.html'),
              Path('tax-deed.html'),
              Path('property-screener.html'),
              Path('calendar.html'),
          ]

          head = '''\n<link rel="manifest" href="manifest.webmanifest">\n<meta name="theme-color" content="#172033">\n<link rel="icon" href="app-icon.svg" type="image/svg+xml">\n'''
          widget = r'''\n<style id="pwa-install-style">#installAppBtn{position:fixed;right:16px;bottom:16px;z-index:9999;border:0;border-radius:999px;padding:10px 16px;background:#1f5eff;color:#fff;font:700 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;box-shadow:0 8px 24px rgba(31,94,255,.28);cursor:pointer}#installAppBtn.installed{display:none}</style>\n<button id="installAppBtn" type="button" aria-label="Install Tax Lien Guide app">Install app</button>\n<script id="pwa-install-script">\n(()=>{\n  if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}\n  let installPrompt=null;\n  const btn=document.getElementById('installAppBtn');\n  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;\n  if(standalone&&btn){btn.classList.add('installed');return;}\n  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});\n  if(btn)btn.addEventListener('click',async()=>{\n    if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return;}\n    alert('To install: on iPhone/iPad use Share → Add to Home Screen. On Chrome/Edge use the browser Install app option.');\n  });\n  window.addEventListener('appinstalled',()=>btn&&btn.classList.add('installed'));\n})();\n</script>\n'''

          for page in pages:
              if not page.exists():
                  continue
              text = page.read_text(encoding='utf-8')
              if 'manifest.webmanifest' not in text:
                  text = text.replace('</head>', head + '\n</head>', 1)
              if 'pwa-install-script' not in text:
                  text = text.replace('</body>', widget + '\n</body>', 1)
              page.write_text(text, encoding='utf-8')
          PY
      - name: Commit PWA page changes
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No page changes."
            exit 0
          fi
          git config user.name "tax-lien-app-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git commit -m "Make tax lien guide installable as an app"
          git pull --rebase origin main
          git push origin main
