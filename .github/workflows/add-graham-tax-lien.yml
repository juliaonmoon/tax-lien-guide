name: Add Graham County Arizona tax lien market

# Graham is already an explicit step in the main recurring refresh. Keep this
# targeted publisher manual-only to avoid duplicate serialized writers when
# its script changes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add verified Graham County tax lien market
        run: python scripts/add_arizona_graham_tax_lien_market.py
      - name: Ensure county filter remains present
        run: python scripts/add_tax_lien_county_filter.py
      - name: Publish Graham County market
        run: |
          if git diff --quiet -- index.html data/tax-sale-market-events.json; then
            echo "No Graham County guide/calendar changes."
            exit 0
          fi
          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/tax-sale-market-events.json
          git commit -m "feat: publish Graham County Arizona tax lien market"
          git push origin HEAD:main
