name: Publish Hernando County tax lien market

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/add_florida_hernando_tax_lien_market.py"
      - ".github/workflows/publish-hernando-tax-lien.yml"
  schedule:
    - cron: "43 14 * * *"

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish verified Hernando County tax-lien market
        run: python scripts/add_florida_hernando_tax_lien_market.py
      - name: Reapply max return rates
        run: python scripts/add_max_return_rates.py
      - name: Reapply tax-lien county and market filters
        run: python scripts/add_tax_lien_county_filter.py
      - name: Recount tax-lien property coverage
        run: python scripts/recount_tax_lien_properties.py
      - name: Safely publish guide changes
        run: |
          if git diff --quiet -- data/ index.html; then
            echo "No Hernando publication changes."
            exit 0
          fi

          rm -rf /tmp/hernando-output
          mkdir -p /tmp/hernando-output
          cp -a data /tmp/hernando-output/data
          cp index.html /tmp/hernando-output/index.html

          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -a /tmp/hernando-output/data data
            cp /tmp/hernando-output/index.html index.html

            if git diff --quiet -- data/ index.html; then
              echo "Latest main already contains Hernando output."
              exit 0
            fi

            git add data/ index.html
            git commit -m "feat: publish Hernando County tax lien market"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Unable to publish Hernando output after 3 safe retries."
          exit 1
