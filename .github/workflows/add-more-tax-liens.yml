name: Add more tax lien states

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before expansion
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests pdfplumber
      - name: Add verified tax lien states
        run: python scripts/add_more_tax_lien_states.py
      - name: Add Mississippi DeSoto tax lien market
        run: python scripts/add_mississippi_tax_lien.py
      - name: Add Kentucky certificate tax lien market
        run: python scripts/add_kentucky_tax_lien.py
      - name: Add South Dakota Stanley County tax lien market
        run: python scripts/add_south_dakota_tax_lien.py
      - name: Refresh Coconino Arizona OTC tax liens
        run: python scripts/refresh_coconino_tax_liens.py
      - name: Add Florida Broward County tax lien market
        run: python scripts/add_florida_broward_tax_lien_market.py
      - name: Add Florida Hillsborough County tax lien market
        run: python scripts/add_florida_hillsborough_tax_lien_market.py
      - name: Add Florida Miami-Dade County tax lien market
        run: python scripts/add_florida_miami_dade_tax_lien_market.py
      - name: Add Florida Palm Beach County tax lien market
        run: python scripts/add_florida_palm_beach_tax_lien_market.py
      - name: Add Florida Duval County tax lien market
        run: python scripts/add_florida_duval_tax_lien_market.py
      - name: Add Florida Lee County tax lien market
        run: python scripts/add_florida_lee_tax_lien_market.py
      - name: Add Florida Escambia County tax lien market
        run: python scripts/add_florida_escambia_tax_lien_market.py
      - name: Add max return rate comparison
        run: python scripts/add_max_return_rates.py
      - name: Publish guide and tax-lien feed updates safely
        run: |
          if git diff --quiet -- index.html data/; then
            echo "No tax-lien changes."
            exit 0
          fi

          rm -rf /tmp/lien-expansion-output
          mkdir -p /tmp/lien-expansion-output
          cp index.html /tmp/lien-expansion-output/index.html
          cp -a data /tmp/lien-expansion-output/data

          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -a /tmp/lien-expansion-output/data data
            cp /tmp/lien-expansion-output/index.html index.html

            if git diff --quiet -- index.html data/; then
              echo "Latest main already contains the generated output."
              exit 0
            fi

            git add index.html data/
            git commit -m "feat: refresh verified tax lien markets"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Publish raced with a newer main commit; retrying from latest main (attempt ${attempt}/3)."
          done

          echo "Unable to publish refreshed output after 3 safe retries."
          exit 1
