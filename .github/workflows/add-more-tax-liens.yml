name: Add more tax lien states

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/add_more_tax_lien_states.py"
      - "scripts/add_mississippi_tax_lien.py"
      - "scripts/refresh_coconino_tax_liens.py"
      - ".github/workflows/add-more-tax-liens.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests pdfplumber
      - name: Add verified tax lien states
        run: python scripts/add_more_tax_lien_states.py
      - name: Add Mississippi DeSoto tax lien market
        run: python scripts/add_mississippi_tax_lien.py
      - name: Refresh Coconino Arizona OTC tax liens
        run: python scripts/refresh_coconino_tax_liens.py
      - name: Commit guide and tax-lien feed updates
        run: |
          if [ -z "$(git status --porcelain -- index.html data/)" ]; then
            echo "No tax-lien changes."
            exit 0
          fi
          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          git commit -m "feat: refresh verified tax lien markets"
          git pull --rebase origin main
          git push origin main
