name: Add sort controls
on:
  push:
    paths:
      - 'sort-controls.js'
      - '.github/workflows/add-sort-controls.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add shared sort control script
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['index.html','tax-lien-properties.html','tax-deed.html','property-screener.html','calendar.html']
          tag = '<script src="sort-controls.js" defer></script>'
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              if tag in text:
                  continue
              if '</body>' in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text)
          PY
      - name: Commit site updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tax-lien-properties.html tax-deed.html property-screener.html calendar.html
          git commit -m "Add adaptive sort controls across site tabs"
          git pull --rebase
          git push
