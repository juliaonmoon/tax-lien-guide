name: Rename tax lien details

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rename-tax-lien-details.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename Tax Lien Properties to Tax Lien Details
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('Tax Lien Properties','Tax Lien Details')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit rename
        run: |
          if git diff --quiet -- '*.html'; then
            echo "No rename needed"
            exit 0
          fi
          git config user.name "tax-lien-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git commit -m "Rename Tax Lien Properties to Tax Lien Details"
          git pull --rebase origin main
          git push origin main
