name: Diagnose Dubuque PDF structure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/debug_dubuque_structure.py"
      - "scripts/refresh_iowa_dubuque_tax_liens.py"
      - ".github/workflows/debug-dubuque-structure.yml"

permissions:
  contents: read

concurrency:
  group: dubuque-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: pip install pdfplumber pypdf requests
      - name: Inspect marker structure without source text
        run: python scripts/debug_dubuque_structure.py
