name: Repair Putnam County tax lien market

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair verified Putnam County tax-lien market
        run: |
          python scripts/add_florida_putnam_tax_lien_market.py
          python scripts/add_max_return_rates.py
          python scripts/add_tax_lien_county_filter.py
          python scripts/recount_tax_lien_properties.py
      - name: Publish repair safely
        run: |
          if git diff --quiet -- data/ index.html; then
            echo "No Putnam repair changes."
            exit 0
          fi
          git config user.name "tax-lien-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html
          git commit -m "chore: repair Putnam tax lien market"
          git pull --rebase origin main
          git push origin HEAD:main
