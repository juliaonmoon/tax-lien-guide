name: Publish Putnam County tax lien market

on:
  workflow_run:
    workflows: ["Refresh tax deed property data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish verified Putnam County tax-lien market
        run: python scripts/add_florida_putnam_tax_lien_market.py
      - name: Reapply max return rates
        run: python scripts/add_max_return_rates.py
      - name: Reapply tax-lien county and market filters
        run: python scripts/add_tax_lien_county_filter.py
      - name: Recount tax-lien property coverage
        run: python scripts/recount_tax_lien_properties.py
      - name: Safely publish guide changes
        run: |
          if git diff --quiet -- data/ index.html; then
            echo "No Putnam publication changes."
            exit 0
          fi

          rm -rf /tmp/putnam-output
          mkdir -p /tmp/putnam-output
          cp -a data /tmp/putnam-output/data
          cp index.html /tmp/putnam-output/index.html

          git config user.name "tax-deed-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -a /tmp/putnam-output/data data
            cp /tmp/putnam-output/index.html index.html

            if git diff --quiet -- data/ index.html; then
              echo "Latest main already contains Putnam output."
              exit 0
            fi

            git add data/ index.html
            git commit -m "feat: publish Putnam County tax lien market"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Unable to publish Putnam output after 3 safe retries."
          exit 1
