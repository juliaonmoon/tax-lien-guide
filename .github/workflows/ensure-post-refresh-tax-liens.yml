name: Ensure post-refresh tax lien markets

on:
  workflow_run:
    workflows: ["Refresh tax deed property data"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ensure-post-refresh-tax-liens.yml"
      - "scripts/validate_post_refresh_market_durability.py"

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-data-writes
  cancel-in-progress: false

jobs:
  ensure-markets:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure verified post-refresh tax lien markets
        run: |
          python scripts/add_colorado_arapahoe_tax_lien_market.py
          python scripts/add_colorado_el_paso_tax_lien_market.py
          python scripts/add_colorado_larimer_tax_lien_market.py
          python scripts/add_colorado_adams_tax_lien_market.py
          python scripts/add_colorado_boulder_tax_lien_market.py
          python scripts/add_colorado_mesa_tax_lien_market.py
          python scripts/add_colorado_pueblo_tax_lien_market.py
          python scripts/add_colorado_douglas_tax_lien_market.py
          python scripts/add_colorado_logan_tax_lien_market.py
          if [ -f scripts/add_colorado_weld_tax_lien_market.py ]; then
            python scripts/add_colorado_weld_tax_lien_market.py
          fi
          python scripts/add_florida_hernando_tax_lien_market.py
          python scripts/add_florida_putnam_tax_lien_market.py
          python scripts/add_iowa_polk_tax_lien_market.py
          python scripts/add_max_return_rates.py
          python scripts/add_tax_lien_county_filter.py
          python scripts/recount_tax_lien_properties.py
      - name: Verify required post-refresh markets survived generation
        run: python scripts/validate_post_refresh_market_durability.py
      - name: Publish consolidated market updates safely
        run: |
          if git diff --quiet -- data/ index.html; then
            echo "No post-refresh market changes."
            exit 0
          fi

          rm -rf /tmp/post-refresh-output
          mkdir -p /tmp/post-refresh-output
          cp -a data /tmp/post-refresh-output/data
          cp index.html /tmp/post-refresh-output/index.html

          git config user.name "tax-lien-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -a /tmp/post-refresh-output/data data
            cp /tmp/post-refresh-output/index.html index.html

            if git diff --quiet -- data/ index.html; then
              echo "Latest main already contains the generated output."
              exit 0
            fi

            git add data/ index.html
            git commit -m "chore: ensure post-refresh tax lien markets"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish raced with a newer main commit; retrying (${attempt}/3)."
          done

          echo "Unable to publish post-refresh market output after 3 safe retries."
          exit 1
