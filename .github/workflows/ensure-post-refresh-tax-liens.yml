      - "scripts/add_iowa_delaware_tax_lien_market.py"

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-post-refresh-market-writes
  cancel-in-progress: false

jobs:
  ensure-markets:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish consolidated market updates from latest main
        run: |
          git config user.name "tax-lien-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/add_colorado_arapahoe_tax_lien_market.py
            python scripts/add_colorado_el_paso_tax_lien_market.py
            python scripts/add_colorado_larimer_tax_lien_market.py
            python scripts/add_colorado_adams_tax_lien_market.py
            python scripts/add_colorado_boulder_tax_lien_market.py
            python scripts/add_colorado_mesa_tax_lien_market.py
            python scripts/add_colorado_pueblo_tax_lien_market.py
            python scripts/add_colorado_douglas_tax_lien_market.py
            python scripts/add_colorado_logan_tax_lien_market.py
            python scripts/add_colorado_alamosa_tax_lien_market.py
            python scripts/add_colorado_morgan_tax_lien_market.py
            python scripts/add_colorado_fremont_tax_lien_market.py
            python scripts/add_colorado_delta_tax_lien_market.py
            python scripts/add_colorado_garfield_tax_lien_market.py
            python scripts/add_colorado_routt_tax_lien_market.py
            python scripts/add_colorado_chaffee_tax_lien_market.py
            python scripts/add_colorado_pitkin_tax_lien_market.py
            python scripts/add_colorado_san_miguel_tax_lien_market.py
            python scripts/add_colorado_clear_creek_tax_lien_market.py
            python scripts/add_colorado_broomfield_tax_lien_market.py
            python scripts/add_colorado_teller_tax_lien_market.py
            python scripts/add_colorado_montrose_tax_lien_market.py
            python scripts/add_colorado_elbert_tax_lien_market.py
            python scripts/add_colorado_grand_tax_lien_market.py
            python scripts/add_colorado_archuleta_tax_lien_market.py
            python scripts/add_colorado_eagle_tax_lien_market.py
            python scripts/add_colorado_rio_blanco_tax_lien_market.py
            python scripts/add_colorado_moffat_tax_lien_market.py
            if [ -f scripts/add_colorado_weld_tax_lien_market.py ]; then
              python scripts/add_colorado_weld_tax_lien_market.py
            fi
            python scripts/add_florida_hernando_tax_lien_market.py
            python scripts/add_florida_putnam_tax_lien_market.py
            python scripts/add_florida_bay_tax_lien_market.py
            python scripts/add_florida_broward_tax_lien_market.py
            python scripts/add_iowa_polk_tax_lien_market.py
            python scripts/add_iowa_dallas_tax_lien_market.py
            python scripts/add_iowa_pottawattamie_tax_lien_market.py
            python scripts/add_iowa_black_hawk_tax_lien_market.py
            python scripts/add_iowa_story_tax_lien_market.py
            python scripts/add_iowa_warren_tax_lien_market.py
            python scripts/add_iowa_ida_tax_lien_market.py
            python scripts/add_iowa_cedar_tax_lien_market.py
            python scripts/add_iowa_delaware_tax_lien_market.py
            python scripts/add_montana_gallatin_tax_lien_market.py
            python scripts/add_montana_missoula_tax_lien_market.py
            python scripts/add_montana_cascade_tax_lien_market.py
            python scripts/add_montana_yellowstone_tax_lien_market.py
            python scripts/add_montana_lewis_clark_tax_lien_market.py
            python scripts/add_montana_lake_tax_lien_market.py
            python scripts/add_montana_flathead_tax_lien_market.py
            python scripts/add_montana_ravalli_tax_lien_market.py
            python scripts/add_montana_glacier_tax_lien_market.py
            python scripts/add_montana_beaverhead_tax_lien_market.py
            python scripts/add_montana_rosebud_tax_lien_market.py
            python scripts/add_montana_carbon_tax_lien_market.py
            python scripts/add_montana_carter_tax_lien_market.py
            python scripts/add_montana_sanders_tax_lien_market.py
            python scripts/add_montana_butte_silver_bow_tax_lien_market.py
            python scripts/add_montana_park_tax_lien_market.py
            python scripts/add_montana_richland_tax_lien_market.py
            python scripts/add_montana_stillwater_tax_lien_market.py
            python scripts/add_montana_powell_tax_lien_market.py
            python scripts/add_montana_madison_tax_lien_market.py
            python scripts/add_montana_jefferson_tax_lien_market.py
            python scripts/add_montana_liberty_tax_lien_market.py
            python scripts/add_montana_broadwater_tax_lien_market.py
            python scripts/add_max_return_rates.py
            python scripts/add_tax_lien_county_filter.py
            python scripts/recount_tax_lien_properties.py
            python scripts/validate_post_refresh_market_durability.py
            python scripts/validate_montana_lewis_clark_market.py
            python scripts/validate_montana_lake_market.py
            python scripts/validate_montana_park_market.py
            python scripts/validate_montana_carter_market.py
            python scripts/validate_montana_sanders_market.py
            python scripts/validate_montana_beaverhead_market.py
            python scripts/validate_montana_powell_market.py
            python scripts/validate_montana_madison_market.py
            python scripts/validate_montana_jefferson_market.py
            python scripts/validate_montana_liberty_market.py
            python scripts/validate_montana_broadwater_market.py
            python scripts/validate_iowa_cedar_market.py
            python scripts/validate_iowa_delaware_market.py

            if git diff --quiet -- data/ index.html; then
              echo "Latest main already contains the generated market output."
              exit 0
            fi

            git add data/ index.html
            git commit -m "chore: ensure post-refresh tax lien markets"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Publish raced with a newer main commit; regenerating from latest main (${attempt}/3)."
          done

          echo "Unable to publish post-refresh market output after 3 fresh-generation retries."
          exit 1
