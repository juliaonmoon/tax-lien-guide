name: Ensure post-refresh tax lien markets

on:
  workflow_run:
    workflows:
      - "Refresh tax deed property data"
      - "Refresh property-level tax liens"
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ensure-post-refresh-tax-liens.yml"
      - "scripts/add_colorado_*_tax_lien_market.py"
      - "scripts/add_florida_*_tax_lien_market.py"
      - "scripts/add_indiana_*"
      - "scripts/add_iowa_*_tax_lien_market.py"
      - "scripts/add_montana_*_tax_lien_market.py"
      - "scripts/add_maryland_*_tax_lien_market.py"
      - "scripts/validate_colorado_*_market.py"
      - "scripts/validate_florida_*_market.py"
      - "scripts/validate_indiana_*"
      - "scripts/validate_iowa_*_market.py"
      - "scripts/validate_montana_*_market.py"
      - "scripts/validate_maryland_*_market.py"
      - "scripts/validate_post_refresh_market_durability.py"
      - "scripts/add_max_return_rates.py"
      - "scripts/add_tax_lien_county_filter.py"
      - "scripts/recount_tax_lien_properties.py"

permissions:
  contents: write

concurrency:
  group: tax-lien-guide-consolidated-post-refresh-market-writes
  cancel-in-progress: false

jobs:
  ensure-markets:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish consolidated market updates from latest main
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "tax-lien-data-bot"
          git config user.email "actions@users.noreply.github.com"

          # Keep Indiana before Maryland. Some Indiana certificate-sale publishers
          # replace their terminal market row and can otherwise strip Maryland rows
          # that were appended immediately after it. This order matches the stable
          # consolidated Indiana/Maryland workflow and makes generation idempotent.
          states=(colorado florida iowa montana)

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            echo "Discovering all committed market publishers from fresh main"
            for state in "${states[@]}"; do
              publishers=(scripts/add_${state}_*_tax_lien_market.py)
              for publisher in "${publishers[@]}"; do
                echo "PUBLISH $publisher"
                python "$publisher"
              done
            done

            indiana_publishers=(
              scripts/add_indiana_*_tax_lien_market.py
              scripts/add_indiana_*certificate*sale*.py
            )
            for publisher in "${indiana_publishers[@]}"; do
              echo "PUBLISH $publisher"
              python "$publisher"
            done

            maryland_publishers=(scripts/add_maryland_*_tax_lien_market.py)
            for publisher in "${maryland_publishers[@]}"; do
              echo "PUBLISH $publisher"
              python "$publisher"
            done

            # Validate county/source/legal safety before shared presentation
            # normalization can rewrite comparison fields such as maxReturn.
            for state in "${states[@]}"; do
              validators=(scripts/validate_${state}_*_market.py)
              for validator in "${validators[@]}"; do
                echo "VALIDATE $validator"
                python "$validator"
              done
            done
            indiana_validators=(scripts/validate_indiana_*_market.py)
            for validator in "${indiana_validators[@]}"; do
              echo "VALIDATE $validator"
              python "$validator"
            done
            maryland_validators=(scripts/validate_maryland_*_market.py)
            for validator in "${maryland_validators[@]}"; do
              echo "VALIDATE $validator"
              python "$validator"
            done

            python scripts/add_max_return_rates.py
            python scripts/add_tax_lien_county_filter.py
            python scripts/recount_tax_lien_properties.py
            python scripts/validate_post_refresh_market_durability.py

            if git diff --quiet -- data/ index.html; then
              echo "Latest main already contains the generated market output."
              exit 0
            fi

            git add data/ index.html
            git commit -m "chore: ensure post-refresh tax lien markets"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Publish raced with a newer main commit; regenerating from latest main (${attempt}/3)."
          done

          echo "Unable to publish post-refresh market output after 3 fresh-generation retries."
          exit 1
